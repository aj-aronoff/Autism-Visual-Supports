<text x="82" y="644" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="20" fill="#99272B" font-weight="bold" text-anchor="start" letter-spacing="0">REFERRAL GUIDANCE, NOT A BOARD</text>
<text x="82" y="672" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="18" fill="#2D3748" font-weight="normal" text-anchor="start" letter-spacing="0">self-injury, aggression or escalation in the words a parent used.</text>
<text x="82" y="698" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="17" fill="#718096" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="italic">Costs ZERO model tokens — it returns before the model is called.</text>
