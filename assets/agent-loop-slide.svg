<text x="718" y="672" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="18" fill="#2D3748" font-weight="normal" text-anchor="start" letter-spacing="0">either knowledge base returns nothing — rule 17, in code, not in a prompt.</text>
<text x="718" y="698" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="17" fill="#718096" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="italic">An ungrounded board looks exactly like a grounded one. So it is a check in the flow.</text>
<path d="M 893 314 Q 773 240 653 314" fill="none" stroke="#A8600C" stroke-width="2.5" marker-end="url(#ah-A8600C)" stroke-dasharray="7 6"/>
<text x="773" y="244" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="18" fill="#A8600C" font-weight="normal" text-anchor="middle" letter-spacing="0" font-style="italic">one retry, with the validation error fed back</text>
<text x="544" y="568" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="21" fill="#2D3748" font-weight="bold" text-anchor="start" letter-spacing="0">The save comes before the review — so a Reviewer failure</text>
<text x="544" y="596" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="21" fill="#2D3748" font-weight="bold" text-anchor="start" letter-spacing="0">costs the verdict, not the board.</text>
