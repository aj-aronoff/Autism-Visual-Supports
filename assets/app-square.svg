<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><rect width="1024" height="1024" fill="#0B1E3D"/>
<text x="512.0" y="160" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="112" font-weight="700"
      fill="#FFFFFF" text-anchor="middle">Autism</text>
<text x="512.0" y="282" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="112" font-weight="700"
      fill="#FFFFFF" text-anchor="middle">Visual</text>
<text x="512.0" y="404" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="112" font-weight="700"
      fill="#FFFFFF" text-anchor="middle">Supports</text>
<rect x="392.0" y="440" width="240" height="7" rx="3.5" fill="#F9C74F"/>
<rect x="80" y="486" width="864" height="372" rx="28" fill="#F7FBFF"/>

<g>
  <rect x="112" y="508" width="360" height="330" rx="18" fill="#F7FBFF" stroke="#2E7CB8" stroke-width="6"/>
  <g transform="translate(174.0,531.0) scale(1.1800)">
<g>
  <!-- legs -->
  <rect x="80"  y="150" width="16" height="44" rx="8" fill="#2E7CB8"/>
  <rect x="104" y="150" width="16" height="44" rx="8" fill="#2E7CB8"/>
  <rect x="74"  y="186" width="26" height="12" rx="6" fill="#2D3748"/>
  <rect x="100" y="186" width="26" height="12" rx="6" fill="#2D3748"/>
  <!-- torso -->
  <rect x="72" y="104" width="56" height="56" rx="22" fill="#5BA4CF"/>
  <!-- left arm resting -->
  <rect x="56" y="110" width="15" height="42" rx="7.5" fill="#5BA4CF"/>
  <circle cx="63.5" cy="153" r="8.5" fill="#F0C49B"/>
  <!-- head -->
  <circle cx="100" cy="72" r="33" fill="#F0C49B"/>
  <path d="M67 68 A33 33 0 0 1 133 68 Q118 50 100 50 Q82 50 67 68 Z" fill="#5A3E2B"/>
  <circle cx="88"  cy="72" r="3.6" fill="#2D3748"/>
  <circle cx="112" cy="72" r="3.6" fill="#2D3748"/>
  <circle cx="76"  cy="84" r="5" fill="#F28B82" opacity=".55"/>
  <circle cx="124" cy="84" r="5" fill="#F28B82" opacity=".55"/>
  <!-- open mouth, so the brush has somewhere to go -->
  <path d="M89 84 Q100 98 111 84 Z" fill="#2D3748"/>
  <path d="M91.5 85.5 Q100 90 108.5 85.5 Z" fill="#F7FBFF"/>
  <!-- raised arm, bent at the elbow, drawn above the head -->
  <path d="M126 116 L157 118 L134 96" stroke="#5BA4CF" stroke-width="15" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="134" cy="96" r="9" fill="#F0C49B"/>
  <!-- toothbrush, bristles landing on the mouth -->
  <g transform="translate(134,96) rotate(-75)">
    <rect x="-5" y="4"   width="10" height="44" rx="5" fill="#A8D4EF"/>
    <rect x="-4" y="-7"  width="8"  height="13" fill="#A8D4EF"/>
    <rect x="-9" y="-25" width="18" height="19" rx="5" fill="#F7FBFF" stroke="#2E7CB8" stroke-width="2.5"/>
    <circle cx="0" cy="-29" r="4.5" fill="#B2DFC4"/>
  </g>
</g></g>
  <text x="292.0" y="818" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="42" font-weight="700"
        fill="#2D3748" text-anchor="middle">Brush teeth</text>
</g>

<g>
  <rect x="552" y="508" width="360" height="330" rx="18" fill="#F7FBFF" stroke="#F9C74F" stroke-width="6"/>
  <g transform="translate(614.0,531.0) scale(1.1800)">
<g transform="rotate(-7 100 20)">
  
  <path d="M68 2 L66 116"  stroke="#C98B5E" stroke-width="5.0" stroke-linecap="round" fill="none"/>
  <path d="M132 2 L134 116" stroke="#C98B5E" stroke-width="5.0" stroke-linecap="round" fill="none"/>
  <!-- seat -->
  <rect x="54" y="114" width="92" height="13.0" rx="6" fill="#C98B5E"/>
  <!-- legs swinging forward -->
  <g transform="rotate(-22 112 120)">
    <rect x="104" y="116" width="16" height="50" rx="8" fill="#2E7CB8"/>
    <rect x="100" y="158" width="28" height="12" rx="6" fill="#2D3748"/>
  </g>
  <g transform="rotate(-34 96 120)">
    <rect x="88" y="116" width="16" height="50" rx="8" fill="#2E7CB8"/>
    <rect x="84" y="158" width="28" height="12" rx="6" fill="#2D3748"/>
  </g>
  <!-- torso -->
  <rect x="73" y="70" width="54" height="52" rx="21" fill="#5BA4CF"/>
  <!-- arms up to the ropes -->
  <g transform="rotate(-26 80 78)">
    <rect x="62" y="44" width="14" height="42" rx="7" fill="#5BA4CF"/>
    <circle cx="69" cy="46" r="7.5" fill="#F0C49B"/>
  </g>
  <g transform="rotate(26 120 78)">
    <rect x="124" y="44" width="14" height="42" rx="7" fill="#5BA4CF"/>
    <circle cx="131" cy="46" r="7.5" fill="#F0C49B"/>
  </g>
  <!-- head -->
  <circle cx="100" cy="42" r="31" fill="#F0C49B"/>
  <path d="M69 40 A31 31 0 0 1 131 40 Q117 21 100 21 Q83 21 69 40 Z" fill="#5A3E2B"/>
  
  <circle cx="89"  cy="44" r="3.4" fill="#2D3748"/>
  <circle cx="111" cy="44" r="3.4" fill="#2D3748"/>
  <path d="M89 55 Q100 66 111 55 Q100 60 89 55 Z" fill="#2D3748"/>
  <circle cx="78"  cy="53" r="4.6" fill="#F28B82" opacity=".55"/>
  <circle cx="122" cy="53" r="4.6" fill="#F28B82" opacity=".55"/>
</g></g>
  <text x="732.0" y="818" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="42" font-weight="700"
        fill="#2D3748" text-anchor="middle">Swing</text>
</g>
<g transform="translate(512,673.0)">
  <circle cx="0" cy="0" r="30" fill="#6BBF8E"/>
  <path d="M-9 -14 L13 0 L-9 14 Z" fill="#FFFFFF"/>
</g>
<text x="512.0" y="942" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="40" font-weight="700"
      fill="#F9C74F" text-anchor="middle" letter-spacing="2">First &#8594; Then boards</text>
</svg>